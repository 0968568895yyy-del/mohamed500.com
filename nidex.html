<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head
<meta charset="UTF-8">
<title>نظام صيدلية سعودي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:#f5f7fa}
.login{height:100vh;display:flex;align-items:center;justify-content:center;background:#0d47a1}
.login-box{background:#fff;padding:40px;border-radius:15px;width:380px}
.login-box h2{text-align:center;color:#0d47a1;margin-bottom:25px}
.login-box input{width:100%;padding:14px;margin:10px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
.login-box button{width:100%;padding:14px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:18px;cursor:pointer;font-weight:bold}
.error{color:red;text-align:center;margin-top:10px;display:none}
.hidden{display:none}
.header{background:#0d47a1;color:#fff;padding:15px;display:flex;justify-content:space-between}
.tabs{background:#1565c0;padding:10px;display:flex;gap:5px}
.tab{padding:12px 25px;background:#1976d2;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px}
.tab.active{background:#fff;color:#0d47a1}
.content{padding:20px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:15px}
.drugs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:500px;overflow:auto;padding:10px;background:#fff;border-radius:10px}
.drug-item{border:2px solid #42a5f5;padding:10px;border-radius:10px;cursor:pointer;background:#e3f2fd;text-align:center}
.cart{background:#fff;border-radius:10px;padding:15px}
.cart-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}
.total-box{background:#e8f5e9;padding:12px;border-radius:8px;margin-top:10px;border:2px dashed #2e7d32}
.total-final{font-size:20px;color:red;font-weight:bold;border-top:2px solid #2e7d32;padding-top:8px;margin-top:8px}
.btn{padding:12px;background:#2e7d32;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold;width:100%;margin-top:8px}
.btn-red{background:#c62828}
.btn-pay{padding:10px;background:#e0e0e0;color:#333;border:2px solid #ccc;border-radius:6px;cursor:pointer;font-size:15px;font-weight:bold;flex:1}
.btn-pay.active{background:#2e7d32;color:#fff}
.pay-methods{display:flex;gap:5px;margin:12px 0}
.pay-label{font-weight:bold;color:#0d47a1;font-size:15px;margin-top:12px;display:block}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#0d47a1;color:#fff;padding:10px;text-align:right}
td{padding:8px;border-bottom:1px solid #ddd;text-align:right}
input[type=text],input[type=number],input[type=date]{padding:8px;border:2px solid #ddd;border-radius:5px;width:100%}
.search-box{padding:10px;width:100%;border:2px solid #42a5f5;border-radius:6px;margin-bottom:10px}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}}
@media(max-width:768px){.grid{grid-template-columns:1fr}.drugs-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="login-box">
    <h2>?? نظام الصيدلية</h2>
    <input type="text" id="user" value="admin" placeholder="اسم المستخدم">
    <input type="password" id="pass" value="1234" placeholder="كلمة المرور">
    <button onclick="doLogin()">دخول</button>
    <div id="err" class="error">بيانات خطأ!</div>
  </div>
</div>

<div id="mainApp" class="hidden">
  <div class="header">
    <h3>?? صيدلية أبو جلال</h3>
    <div><span id="gDate"></span> <button onclick="logout()" style="margin-right:10px;padding:5px 10px;background:red;color:#fff;border:none;border-radius:5px;cursor:pointer">خروج</button></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('pos',this)">نقطة البيع</button>
    <button class="tab" onclick="showTab('stock',this)">المخزن</button>
    <button class="tab" onclick="showTab('reports',this)">التقارير</button>
  </div>

  <div class="content">
    <div id="pos">
      <div class="grid">
        <div>
          <input type="text" class="search-box" id="search" placeholder="بحث..." onkeyup="loadDrugs()">
          <div id="drugsGrid" class="drugs-grid"></div>
        </div>
        <div class="cart">
          <h4 style="color:#0d47a1">?? الفاتورة</h4>
          <div id="cartItems" style="min-height:150px;max-height:300px;overflow:auto">فاضي</div>
          <div class="total-box">
            <div style="display:flex;justify-content:space-between"><span>المجموع:</span><span id="sub">0.00</span></div>
            <div style="display:flex;justify-content:space-between"><span>ضريبة 15%:</span><span id="vat">0.00</span></div>
            <div class="total-final" style="display:flex;justify-content:space-between"><span>الإجمالي:</span><span id="grand">0.00</span></div>
          </div>

          <label class="pay-label">طريقة الدفع:</label>
          <div class="pay-methods">
            <button type="button" class="btn-pay active" onclick="setPay('نقدي',this)">نقدي</button>
            <button type="button" class="btn-pay" onclick="setPay('شبكة',this)">شبكة</button>
            <button type="button" class="btn-pay" onclick="setPay('فيزا',this)">فيزا</button>
          </div>

          <button class="btn" onclick="printBill()">طباعة F1</button>
          <button class="btn btn-red" onclick="clearCart()">إلغاء</button>
        </div>
      </div>
    </div>

    <div id="stock" class="hidden">
      <h4 style="color:#0d47a1;margin-bottom:15px">?? المخزن</h4>
      <div style="background:#fff;padding:15px;margin-bottom:15px;border-radius:8px">
        <input type="text" id="dName" placeholder="اسم الدواء" style="margin:5px">
        <input type="text" id="dCode" placeholder="باركود" style="margin:5px">
        <input type="number" id="dPrice" placeholder="السعر" step="0.01" style="margin:5px">
        <input type="number" id="dQty" placeholder="الكمية" style="margin:5px">
        <input type="date" id="dExp" style="margin:5px">
        <button class="btn" onclick="addDrug()">إضافة</button>
      </div>
      <table><thead><tr><th>الدواء</th><th>السعر</th><th>الكمية</th><th>حذف</th></tr></thead><tbody id="stockTable"></tbody></table>
    </div>

    <div id="reports" class="hidden">
      <h4 style="color:#0d47a1;margin-bottom:15px">?? التقارير</h4>
      <div style="background:#fff;padding:20px;border-radius:8px">
        <div style="display:flex;gap:15px;margin-bottom:15px">
          <div style="flex:1;background:#e3f2fd;padding:15px;text-align:center;border-radius:8px">
            <h5>الفواتير</h5><h3 id="billCount">0</h3>
          </div>
          <div style="flex:1;background:#e8f5e9;padding:15px;text-align:center;border-radius:8px">
            <h5>المبيعات</h5><h3 id="sales">0.00</h3>
          </div>
          <div style="flex:1;background:#fff3e0;padding:15px;text-align:center;border-radius:8px">
            <h5>الضريبة</h5><h3 id="tax">0.00</h3>
          </div>
        </div>
        <button class="btn" onclick="refreshReports()">تحديث</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea" class="hidden"></div>

<script>
var drugs = [
  {id:1,name:'بنادول 500',price:12.5,qty:100,barcode:'1',exp:'2027-12-31'},
  {id:2,name:'بروفين 400',price:18,qty:80,barcode:'2',exp:'2026-08-15'},
  {id:3,name:'فيتامين سي',price:35,qty:50,barcode:'3',exp:'2025-11-20'}
];
var cart = [];
var bills = [];
var invoiceNo = 1000;
var paymentMethod = 'نقدي';

function doLogin(){
  var u = document.getElementById('user').value;
  var p = document.getElementById('pass').value;
  if(u=='admin' && p=='1234'){
    document.getElementById('loginScreen').className = 'hidden';
    document.getElementById('mainApp').className = '';
    document.getElementById('gDate').innerHTML = new Date().toLocaleDateString('ar-SA');
    loadDrugs();
    loadStock();
  } else {
    document.getElementById('err').style.display = 'block';
    setTimeout(function(){document.getElementById('err').style.display='none'},2000);
  }
}

function logout(){
  document.getElementById('mainApp').className = 'hidden';
  document.getElementById('loginScreen').className = 'login';
}

function showTab(tab,btn){
  var tabs = document.getElementsByClassName('tab');
  for(var i=0;i<tabs.length;i++) tabs[i].className = 'tab';
  btn.className = 'tab active';
  document.getElementById('pos').className = 'hidden';
  document.getElementById('stock').className = 'hidden';
  document.getElementById('reports').className = 'hidden';
  document.getElementById(tab).className = '';
  if(tab=='stock') loadStock();
  if(tab=='reports') refreshReports();
}

function setPay(method,btn){
  paymentMethod = method;
  var btns = document.getElementsByClassName('btn-pay');
  for(var i=0;i<btns.length;i++) btns[i].className = 'btn-pay';
  btn.className = 'btn-pay active';
}

function loadDrugs(){
  var s = document.getElementById('search').value.toLowerCase();
  var html = '';
  for(var i=0;i<drugs.length;i++){
    if(drugs[i].qty>0 && drugs[i].name.toLowerCase().indexOf(s)>-1){
      html += '<div class="drug-item" onclick="addToCart('+drugs[i].id+')"><b>'+drugs[i].name+'</b><br><span style="color:green;font-size:18px">'+drugs[i].price+' ريال</span><br><small>كمية: '+drugs[i].qty+'</small></div>';
    }
  }
  document.getElementById('drugsGrid').innerHTML = html;
}

function addToCart(id){
  for(var i=0;i<drugs.length;i++){
    if(drugs[i].id==id){
      if(drugs[i].qty<=0){alert('مافي كمية');return}
      var found = false;
      for(var j=0;j<cart.length;j++){
        if(cart[j].id==id){cart[j].qty++;found=true;break;}
      }
      if(!found) cart.push({id:id,name:drugs[i].name,price:drugs[i].price,qty:1});
      drugs[i].qty--;
      break;
    }
  }
  showCart();
  loadDrugs();
}

function showCart(){
  if(cart.length==0){
    document.getElementById('cartItems').innerHTML='فاضي';
    document.getElementById('sub').innerHTML='0.00';
    document.getElementById('vat').innerHTML='0.00';
    document.getElementById('grand').innerHTML='0.00';
    return;
  }
  var html=''; var sub=0;
  for(var i=0;i<cart.length;i++){
    var line = cart[i].qty * cart[i].price;
    sub += line;
    html += '<div class="cart-item"><span>'+cart[i].name+' × '+cart[i].qty+'</span><span>'+line.toFixed(2)+'</span></div>';
  }
  var vat = sub * 0.15;
  var grand = sub + vat;
  document.getElementById('cartItems').innerHTML = html;
  document.getElementById('sub').innerHTML = sub.toFixed(2);
  document.getElementById('vat').innerHTML = vat.toFixed(2);
  document.getElementById('grand').innerHTML = grand.toFixed(2);
}

function printBill(){
  if(cart.length==0){alert('السلة فاضية');return}
  invoiceNo++;
  var now = new Date();
  var dateTime = now.toLocaleString('ar-SA');
  var hijri = now.toLocaleDateString('ar-SA-u-ca-islamic');
  var sub = 0;
  for(var i=0;i<cart.length;i++) sub += cart[i].qty * cart[i].price;
  var vat = sub * 0.15;
  var grand = sub + vat;
  var items = '';
  for(var i=0;i<cart.length;i++){
    items += '<div style="display:flex;justify-content:space-between"><span>'+cart[i].name+' × '+cart[i].qty+'</span><span>'+(cart[i].qty*cart[i].price).toFixed(2)+'</span></div>';
  }
  var html = '<div style="max-width:80mm;margin:auto;font-size:12px">'
    + '<h3 style="text-align:center">صيدلية أبو جلال</h3>'
    + '<p style="text-align:center">الرقم الضريبي: 300000003</p><hr>'
    + '<div style="display:flex;justify-content:space-between"><span>رقم:</span><span>'+invoiceNo+'</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span>التاريخ:</span><span>'+dateTime+'</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span>هجري:</span><span>'+hijri+'</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span>الدفع:</span><span>'+paymentMethod+'</span></div><hr>'
    + items + '<hr>'
    + '<div style="display:flex;justify-content:space-between"><span>المجموع:</span><span>'+sub.toFixed(2)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span>ضريبة:</span><span>'+vat.toFixed(2)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;font-weight:bold"><span>الإجمالي:</span><span>'+grand.toFixed(2)+'</span></div><hr>'
    + '<p style="text-align:center">شكراً</p></div>';
  document.getElementById('printArea').innerHTML = html;
  document.getElementById('printArea').className = '';
  window.print();
  document.getElementById('printArea').className = 'hidden';
  bills.push({total:grand,vat:vat});
  cart = [];
  showCart();
  loadDrugs();
}

function clearCart(){
  if(confirm('إلغاء؟')){
    for(var i=0;i<cart.length;i++){
      for(var j=0;j<drugs.length;j++){
        if(drugs[j].id==cart[i].id){drugs[j].qty += cart[i].qty;break;}
      }
    }
    cart = [];
    showCart();
    loadDrugs();
  }
}

function loadStock(){
  var html = '';
  for(var i=0;i<drugs.length;i++){
    html += '<tr><td>'+drugs[i].name+'</td><td>'+drugs[i].price+'</td><td>'+drugs[i].qty+'</td><td><button onclick="delDrug('+drugs[i].id+')" style="background:red;color:#fff;border:none;padding:3px 8px;border-radius:3px">حذف</button></td></tr>';
  }
  document.getElementById('stockTable').innerHTML = html;
}

function addDrug(){
  var n=document.getElementById('dName').value;
  var c=document.getElementById('dCode').value;
  var p=parseFloat(document.getElementById('dPrice').value);
  var q=parseInt(document.getElementById('dQty').value);
  var e=document.getElementById('dExp').value;
  if(!n||!c||!p||!q||!e){alert('اكمل البيانات');return}
  drugs.push({id:Date.now(),name:n,barcode:c,price:p,qty:q,exp:e});
  document.getElementById('dName').value='';
  document.getElementById('dCode').value='';
  document.getElementById('dPrice').value='';
  document.getElementById('dQty').value='';
  document.getElementById('dExp').value='';
  loadStock();
  loadDrugs();
  alert('تم');
}

function delDrug(id){
  if(confirm('حذف؟')){
    var newDrugs = [];
    for(var i=0;i<drugs.length;i++) if(drugs[i].id!=id) newDrugs.push(drugs[i]);
    drugs = newDrugs;
    loadStock();
    loadDrugs();
  }
}

function refreshReports(){
  var totalSales = 0;
  var totalVAT = 0;
  for(var i=0;i<bills.length;i++){
    totalSales += bills[i].total;
    totalVAT += bills[i].vat;
  }
  document.getElementById('billCount').innerHTML = bills.length;
  document.getElementById('sales').innerHTML = totalSales.toFixed(2);
  document.getElementById('tax').innerHTML = totalVAT.toFixed(2);
}

document.onkeydown = function(e){
  if(e.key=='F1'){e.preventDefault();printBill();}
};
</script>
</body>
</html>
